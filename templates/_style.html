<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --ink:#1f1d1a; --muted:#5f5a52; --line:#e4dfd6;
  --accent:#2f5d4e; --accent-ink:#ffffff; --warn:#a33a2b; --warn-bg:#fbeae7; --tag:#efece6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --surface:#211f1c; --ink:#ece8e1; --muted:#a8a197; --line:#36322d;
    --accent:#7fb8a3; --accent-ink:#10201a; --warn:#f0907f; --warn-bg:#3a201c; --tag:#2c2925;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#211f1c; --ink:#ece8e1; --muted:#a8a197; --line:#36322d;
  --accent:#7fb8a3; --accent-ink:#10201a; --warn:#f0907f; --warn-bg:#3a201c; --tag:#2c2925;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo",sans-serif;
  line-height:1.75;font-size:16px;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--line);background:var(--surface)}
header.site .wrap{padding-top:20px;padding-bottom:16px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--muted);margin:0}
.brand a{color:inherit;text-decoration:none}
h1{font-size:24px;line-height:1.45;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:20px 0}
.summary ul{margin:6px 0 0;padding-left:1.2em}
h2{font-size:19px;margin:32px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
h2 .n{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.item .t{font-weight:700;font-size:16px;line-height:1.6;margin:0 0 6px;word-break:break-word}
.item .t a{text-decoration:none;color:var(--ink)}
.item .t a:hover{text-decoration:underline}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.dl{color:var(--ink);font-weight:700}
.dl.urgent{color:var(--warn)}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;background:var(--tag);border-radius:999px;padding:2px 10px;color:var(--muted)}
.imp{font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.imp.h{background:var(--warn-bg);color:var(--warn)}
.note{margin-top:10px;font-size:14px;border-left:3px solid var(--accent);padding:4px 10px;background:var(--bg)}
.note b{font-size:12px;color:var(--muted);display:block;font-weight:700}
.src{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);font-size:14px}
.cta{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:18px;margin:28px 0}
.cta p{margin:0 0 10px}
.cta a.btn{display:inline-block;background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;border-radius:8px;padding:10px 18px}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding:20px 0 40px;font-size:13px;color:var(--muted)}
footer.site p{margin:4px 0}
.archive li{margin:4px 0}
.lead{font-size:15px;margin:18px 0 0}
.crumbs{font-size:13px;color:var(--muted);margin:2px 0 0}
.crumbs a{color:inherit}
.find{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:20px 0}
.find-h{font-weight:700;font-size:14px;margin:0 0 6px}
.find ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.find li a{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;text-decoration:none;background:var(--bg)}
.prefs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.prefs li{font-size:15px}
.prefs .n,.more{font-size:13px;color:var(--muted);margin-left:6px}
.more{margin:8px 0 0}
@media (max-width:480px){ h1{font-size:21px} .item{padding:12px 14px} }
</style>
