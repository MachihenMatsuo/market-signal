name: 毎日の収集

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）。毎時0分は混んで遅れやすいためずらす
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market-signal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 情報源から集める
        run: python -m market_signal collect
      - name: 記録を保存
        run: |
          git config user.name "market-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "収集 $(TZ=Asia/Tokyo date +%F)"
          git push
      - name: 失敗したら知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "収集に失敗しました（$(TZ=Asia/Tokyo date +%F)）" \
            --body "実行の記録：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
