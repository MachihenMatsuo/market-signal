# ─────────────────────────────────────────────
# 判定基準（何を載せ、何を重要とするか）
# 松尾さんの食の知識を「最初に一度だけ」入れる場所です。
# 言葉を足したり消したりするだけで、配信の中身が変わります。
# ─────────────────────────────────────────────

# 業態の振り分け。どれかの言葉が題名・業種欄・本文の抜粋にあれば、その業態に付けます。
business_types:
  飲食店:
    - 飲食店
    - 飲食業
    - 飲食サービス
    - 宿泊業、飲食サービス業
    - 外食
    - 中食
    - レストラン
    - 食堂
    - 居酒屋
    - カフェ
    - テイクアウト
    - キッチンカー
  食品製造:
    - 食品製造
    - 食品加工
    - 加工食品
    - 食品工場
    - HACCP
    - ハサップ
    - 6次産業
    - 六次産業
    - 農商工連携
    - 酒類製造
    - 酒蔵
    - ワイナリー
  食品卸・小売:
    - 食品卸
    - 卸売業、小売業
    - 食品小売
    - スーパーマーケット
    - 青果
    - 鮮魚
    - 精肉
    - 酒類販売
    - 販路開拓
    - 輸出

# 業態を問わず、飲食・食品の事業者にも関係するもの（「共通」として載せます）
common_keywords:
  - 全業種
  - 中小企業
  - 小規模事業者
  - 人手不足
  - 省力化
  - 省人化
  - 賃上げ
  - 最低賃金
  - 価格転嫁
  - 事業承継
  - 創業
  - インボイス
  - IT導入
  - デジタル化
  - 省エネ
  - 設備投資

# 行政の発表は、次の言葉のどれかを含むものだけ載せます
food_keywords:
  - 食品
  - 食料
  - 食材
  - 飲食
  - 外食
  - 食品表示
  - 食中毒
  - 食品衛生
  - HACCP
  - 添加物
  - アレルギー
  - 異物混入
  - 自主回収
  - リコール
  - 農産物
  - 水産物
  - 畜産物
  - 青果
  - 米穀
  - 主食用米
  - 備蓄米
  - 米価
  - 小麦
  - 原材料
  - 酒類
  - 日本酒
  - ワイン
  - 食品ロス
  - 地理的表示
  - 有機農産物
  - 輸出
  - 学校給食
  - 鳥インフルエンザ
  - 豚熱
  # ↓2026年10月の農林水産省の発表を見て追加（食の事業者に関係するのに、上の言葉で拾えなかったもの）
  - 不適正表示
  - そうざい
  - 惣菜
  - 原産地
  - 産米
  - 米に関する
  - バター
  - 脱脂粉乳
  - 乳製品
  - 家きん肉
  - 輸入一時停止
  - 特定農林水産物
  - 家畜伝染病予防法
  - オーガニック

# 補助金の対象業種が絞られているとき（jGrantsの「業種」欄）、次のどれかが入っていなければ載せません
# （例：「建設業」だけ、「運輸業、郵便業」だけの補助金は、飲食・食品の事業者は使えない）
food_related_industries:
  - 宿泊業、飲食サービス業
  - 卸売業、小売業
  - 製造業
  - 農業、林業
  - 漁業

# 次の言葉を含むものは、上に当てはまっても載せません
exclude_keywords:
  - 人事異動
  - 叙勲
  - 褒章
  - 大臣記者会見
  - 入札公告
  - 一般競争入札
  - 職員の懲戒
  - 森林
  - 林業
  - 木材
  - 漁船
  # 表彰・受賞・人の紹介は、事業者の判断に使わないので除く
  - 表彰
  - 受賞
  - 選出
  - 感謝状
  - 天皇杯
  - 大臣政務官の海外出張
  - 大臣等の国内出張

# 重要度（高・中・低）
importance:
  high:
    kinds:
      - 回収・注意喚起
    title_keywords:
      - 改正
      - 施行
      - 義務化
      - 公布
      - 措置命令
      - 注意喚起
      - 食中毒
      - 自主回収
      - 不適正表示
      - 輸入一時停止
    # 補助金・公募で、締切までこの日数以内なら「高」
    subsidy_deadline_within_days: 21
  medium:
    kinds:
      - 補助金・公募
    title_keywords:
      - 公募
      - 募集
      - 価格
      - 需給
      - 見通し
      - 支援
