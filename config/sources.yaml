# ─────────────────────────────────────────────
# 情報源の一覧（商用の配信に使ってよいことを、各機関の利用規約で確かめたものだけ）
# 確認日：2026年10月20日
#
# 使っていないもの（利用規約で再配布・営利利用が断られているため。使うなら事前に許可が必要）
#   ・消費者庁のRSS、厚生労働省のRSS（「営利・非営利を問わず」メールマガジン等での再配布を断っている）
#   ・J-Net21（中小機構。商業目的の利用を禁止）
#   ・厚生労働省「食品衛生申請等システム」の回収情報（営利目的の複製・頒布を禁止）
#   ・PR TIMESなどのプレスリリース配信サイト（有償目的の利用を禁止）
# ─────────────────────────────────────────────

sources:
  - id: jgrants
    type: jgrants
    publisher: jGrants（デジタル庁）
    # jGrants API利用規約 第5条：出典「出典：J グランツ」、加工した場合はその旨の記載が必要
    attribution: 出典：J グランツ
    terms: https://fs2.jgrants-portal.go.jp/API%E5%88%A9%E7%94%A8%E8%A6%8F%E7%B4%84.pdf
    url: https://api.jgrants-portal.go.jp/exp/v1/public/subsidies
    page_url: https://www.jgrants-portal.go.jp/subsidy/{id}
    # 検索語（2文字以上）。それぞれ「受付中」の補助金を探す
    keywords:
      - 飲食
      - 食品
      - 農林水産
      - 小規模事業者
      - 中小企業
      - 省力化
      - 事業承継
      - 創業
      - 販路
      - 設備
      - 賃上げ
      - 観光
    # この言葉の検索で見つかった補助金は、業種欄が分からなくても載せる
    relevant_search_keywords:
      - 飲食
      - 食品
    detail_limit: 60   # 1回の実行で詳細を取りに行く上限（新しく見つかったものだけ）

  - id: maff_press
    type: rss
    publisher: 農林水産省
    kind: 行政の発表
    # 公共データ利用規約（第1.0版）。出典「出典:農林水産省ウェブサイト(当該ページのURL)」
    attribution: 出典：農林水産省ウェブサイト
    terms: https://www.maff.go.jp/j/use/link.html
    url: https://www.maff.go.jp/rss.xml

  - id: mirasapo_subsidy
    type: rss
    publisher: ミラサポplus（中小企業庁）
    kind: 行政の発表
    # 公共データ利用規約（第1.0版）に準拠
    attribution: 出典：ミラサポplus
    terms: https://mirasapo-plus.go.jp/about/terms/
    url: https://mirasapo-plus.go.jp/category/infomation/subsidy/feed/
    # 中小企業向けの補助金のお知らせだけが流れてくるので、除外語に当たらない限りすべて載せる
    match: all
